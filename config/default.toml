# antbot — default configuration (xyz:ANT HIP-3 premium mean-reversion).
#
# Every threshold of the strategy lives here. Values come from the research
# (writeup_v2_fr.md §2, sizing_fr.md §2/§4/§7, backtest.py S2_ANT):
#   * entry |premium| >= 50 bps, fade it (premium > 0 -> short, < 0 -> long)
#   * hold up to 8h (base rule "8h_fixed"), maker-only entries
#   * starting notional 2.5k USD, hard cap 10k USD, 1x isolated
#   * kill: hit rate < 80 %, |premium| durably > 150 bps, spec change
#
# Amounts are in USD, durations in seconds, rates as fractions (0.0001 = 1 bp)
# unless the key name ends in `_bps`.

# paper (default, live mainnet market data + simulated fills, no key, never
# calls /exchange) | testnet | mainnet (REAL FUNDS; requires `--mainnet`,
# ANTBOT_CONFIRM_MAINNET=yes-i-understand, HL_PRIVATE_KEY = an API wallet key
# and HL_ACCOUNT_ADDRESS = the main account; see README).
mode = "paper"

[market]
# HIP-3 builder-deployed perp dex and coin name as used by the info API.
# Native Hyperliquid perps: dex = "" and a bare coin name (coin = "BTC").
dex = "xyz"
coin = "xyz:ANT"
# Baseline spec snapshot. A live value differing from these triggers the
# spec-change kill rule (see [risk].kill_on_spec_change). The funding
# multiplier, growth mode and deployer fee scale only exist on HIP-3 dexs
# and are not checked on native perps (dex = "").
# Optional: expected_margin_mode = "strictIsolated" (meta.universe[].marginMode).
expected_funding_multiplier = 0.005   # perpDexs.assetToFundingMultiplier
expected_growth_mode = "enabled"      # meta.universe[].growthMode
expected_deployer_fee_scale = 1.0     # meta.universe[].deployerFeeScale
expected_sz_decimals = 2              # meta.universe[].szDecimals
expected_max_leverage = 10            # meta.universe[].maxLeverage

[network]
mainnet_info_url = "https://api.hyperliquid.xyz/info"
mainnet_exchange_url = "https://api.hyperliquid.xyz/exchange"
mainnet_ws_url = "wss://api.hyperliquid.xyz/ws"
testnet_info_url = "https://api.hyperliquid-testnet.xyz/info"
testnet_exchange_url = "https://api.hyperliquid-testnet.xyz/exchange"
testnet_ws_url = "wss://api.hyperliquid-testnet.xyz/ws"
http_timeout_secs = 10

[strategy]
# Premium definition (backtest.py / HL funding docs):
#   premium = 0.5 * (impact_bid_px + impact_ask_px) / oracle_px - 1
# "impact" uses activeAssetCtx.impactPxs (same as fundingHistory.premium),
# "book_mid" uses the l2Book best bid/ask mid as a fallback.
premium_source = "impact"             # impact | book_mid
entry_threshold_bps = 50.0            # enter when |premium| >= this
# Early exit once the premium has converged to <= this on the side we faded
# (|premium| <= exit_converge_bps, or crossed to the other side). The backtest
# base rule is 8h_fixed: set early_exit_on_converge = false to reproduce it
# exactly (tests/strategy_backtest.rs replays its 24 trades).
exit_converge_bps = 10.0
early_exit_on_converge = true
max_hold_secs = 28800                 # 8h hard deadline
cooldown_after_exit_secs = 3600       # backtest: next signal from exit hour + 1h
# Entry: maker-only ALO (post-only) limit orders.
entry_timeout_secs = 900              # give up an unfilled entry after 15 min
requote_interval_secs = 20            # min delay between reprices of a resting ALO
requote_drift_bps = 5.0               # reprice only if our px is this far from target
# Exit: maker first, then IOC taker fallback inside the last window before the
# deadline (or immediately on kill / converge if maker exit does not fill).
taker_fallback_window_secs = 900      # last 15 min before max_hold
exit_maker_timeout_secs = 600         # converge-exit: go taker after 10 min resting
taker_max_slippage_bps = 50.0         # IOC limit px = best +/- this
# Rolling mean of the premium (one sample per 5 s slot) used by the signal,
# the convergence exit and the persistent-premium kill rule. 3600 matches the
# backtested signal (fundingHistory.premium = hourly mean of 5 s samples),
# evaluated continuously instead of once per hour. Nothing trades until 80%
# of the window is sampled (samples persist across restarts). 0 = the
# instantaneous ctx premium, which is NOT the backtested signal.
premium_avg_secs = 3600
# After an entry is abandoned with nothing filled (timeout, signal gone,
# rejected), wait this long before a new entry.
entry_retry_cooldown_secs = 60
# Order pacing (protects the per-address action budget): minimum gap between
# two new orders, and cap on new orders + cancels in any rolling minute
# (cancels are never blocked, only counted).
min_order_interval_ms = 1000
max_order_actions_per_min = 30

[sizing]
notional_usd = 2500.0                 # starting notional per position
max_notional_usd = 10000.0            # cap (cannot exceed the built-in 10k hard cap)
leverage = 1                          # 1x default, 2x maximum allowed
margin_mode = "isolated"              # only "isolated" is accepted

[risk]
# Rolling hit rate over the last N closed trades. A "hit" is a trade whose
# |premium| moved toward 0 between entry and exit (the writeup's "moved toward 0" rate),
# or "pnl_positive" for net-PnL > 0.
hit_rate_window = 20
hit_rate_min = 0.80
hit_definition = "premium_toward_zero" # premium_toward_zero | pnl_positive
# |premium| above this for longer than the duration -> kill (regime change).
persistent_premium_bps = 150.0
persistent_premium_secs = 7200
kill_on_spec_change = true
daily_loss_limit_usd = 150.0          # realized + unrealized, UTC day
max_drawdown_usd = 300.0              # from peak equity
flatten_on_kill = true                # close the position (maker->taker) on kill
# Maker phase of a kill flatten before falling back to IOC (0 = taker at once).
# Without flatten, a kill cancels orders and leaves the position untouched.
kill_flatten_maker_secs = 120
# The kill state is persisted in <data_dir>/risk_state.json and needs a manual
# `antbot reset-kill --confirm` to resume trading.

[fees]
# Tier 0, HIP-3 deployerFeeScale 1.0 with growth mode enabled (sizing_fr.md §2):
# maker 0.003 %, taker 0.009 %. Standard (growth off) would be 0.030 / 0.090 %.
maker_rate = 0.00003
taker_rate = 0.00009

[timing]
rest_fallback_poll_secs = 5           # metaAndAssetCtxs poll when WS is stale
ws_stale_secs = 15                    # no WS market data for this long -> stale
ws_ping_secs = 50
ws_reconnect_initial_ms = 500
ws_reconnect_max_ms = 30000
meta_poll_secs = 60                   # spec-change detection
signal_sample_secs = 60               # premium sample row in signals.csv
state_persist_secs = 30
heartbeat_secs = 300                  # heartbeat log line (state, premium, PnL)
# REST token bucket (HL budget: 1200 weight/min per IP; info calls weigh 2-20).
# The 1200 weight/min (= 20 weight/s) budget is per public IP and SHARED by
# every container / process on the same host: with N bots on one host keep
# the sum of their rest_refill_per_sec <= 20 (e.g. 2 bots at 10.0, 4 at 5.0).
# `antbot check-config` prints this instance's share.
rest_bucket_capacity = 100.0
rest_refill_per_sec = 10.0

[monitor]
# Data dir: state files, signals.csv / orders.csv / trades.csv, logs/.
data_dir = "data"
# Logs go to stdout and to <data_dir>/logs/antbot.log.YYYY-MM-DD (daily
# rotation). Level / filters from RUST_LOG (default "info").
log_json = false                      # JSON lines instead of text (both outputs)
log_max_files = 7                     # daily log files kept (0 = keep all, min 2)
# Telegram alerts: entries, exits, kill switch, errors, startup / shutdown,
# daily summary. Needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in the env;
# without them alerts are disabled with a log line.
telegram_enabled = true
telegram_max_per_min = 20             # rate limit (queued alerts are merged)
# Delivery: timeouts / transport errors and 5xx are retried with backoff
# (doubling, capped at 60 s, +0..25 % jitter); 429 honours retry_after;
# other 4xx are not retried. Worst case with these values: ~4 min per
# message, in a background task (the trading loop never waits; alerts
# raised meanwhile are queued and merged).
telegram_http_timeout_secs = 25       # timeout of one sendMessage call (1-120)
telegram_max_attempts = 6             # attempts per message, first one included (1-10)
telegram_retry_backoff_secs = 2       # first retry delay, doubled each time (1-60)
# Hold "exit started" this long: when the trade closes meanwhile, a single
# combined exit message is sent. Flushed when the window ends and at
# shutdown, never dropped. 0 = send it at once.
telegram_exit_coalesce_secs = 10
# Read-only commands /pnl, /trades, /help, answered only in the private chat
# whose id is TELEGRAM_CHAT_ID (your user id; ignored for group ids). Needs
# telegram_enabled and both env vars. Commands never change state or orders.
telegram_commands_enabled = true
daily_summary = true                  # summary of the previous UTC day after 00:00 UTC
# Telegram header of every alert / reply. Default "[antbot <mode> <coin>]"
# ("MAINNET" in capitals). instance_name replaces "antbot" (one name per
# container when several bots share a chat); telegram_prefix replaces the
# whole header verbatim. Env overrides: ANTBOT_INSTANCE_NAME,
# ANTBOT_TELEGRAM_PREFIX.
# instance_name = "ant-1"
# telegram_prefix = "[ant-1 paper]"
# Internal HTTP server: GET /healthz (200 healthy / 503 not) and GET /metrics
# (Prometheus text, ?format=json for JSON). Loopback only (127.0.0.1 / ::1);
# unset = no server (`antbot healthcheck` then checks the run lock). Env
# override: ANTBOT_HEALTH_LISTEN.
# health_listen = "127.0.0.1:9100"

[paper]
# Paper mode: live mainnet market data, simulated fills, never calls /exchange.
initial_balance_usd = 10000.0         # simulated account, for available margin
# A resting ALO fills when the opposite best price reaches it (book touch or
# cross) or a public trade prints at / through it. fill_on_touch = false only
# counts trades strictly through our price (pessimistic queue position).
fill_on_touch = true
# Queue model for touch fills: the size shown at our price when the order
# joins the level is ahead of us; prints at our price serve that queue first
# (it also shrinks with the level). false = we are first in the queue
# (optimistic).
queue_model = true

[live]
# Testnet / mainnet executor.
stray_orders = "cancel"               # unknown open orders on the coin at startup: cancel | keep
adopt_position = true                 # manage a position found at startup (fresh 8h clock); false = halt
cancel_on_shutdown = true             # SIGINT / SIGTERM cancels the bot's open orders
flatten_on_shutdown = false           # keep the position on shutdown by default
reconcile_secs = 30                   # clearinghouseState / openOrders reconciliation period
max_exchange_actions_per_min = 60     # client-side per-address action budget (cancels always allowed; pre-entry updateLeverage counted)
rate_limit_backoff_secs = 60          # pause new orders after a rate-limit answer
expires_after_ms = 30000              # expiresAfter window on signed actions (0 = off)
# Trade a Hyperliquid sub-account / vault (0x + 40 hex): sent as vaultAddress
# with every signed action; positions, orders and fills are read for it.
# HL_PRIVATE_KEY stays an API wallet of the master account. Env override:
# HL_VAULT_ADDRESS (or HL_VAULT_ADDRESS_FILE). Unset = the account itself.
# vault_address = "0x..."
