[package]
name = "antbot"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "xyz:ANT HIP-3 premium mean-reversion bot for Hyperliquid (paper / testnet / mainnet-guarded)"
license = "UNLICENSED"
publish = false

[lib]
name = "antbot"
path = "src/lib.rs"

[[bin]]
name = "antbot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
dotenvy = "0.15"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rmp-serde = "1"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "rt-multi-thread", "macros", "net", "time", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
